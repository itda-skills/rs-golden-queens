name: 한국장 매매동향 푸시

on:
  # Cloudflare cron-worker(cron-worker/)가 정시에 dispatch.
  # 필요하면 Actions 탭에서 수동 실행 가능(실패분 복구 시 date 지정).
  workflow_dispatch:
    inputs:
      date:
        description: "발송할 거래일 (YYYYMMDD, 비우면 오늘). 휴장일이면 휴장 안내만 발송됨"
        required: false
        default: ""

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO_DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # 데이터 저장소(rs-golden-queens-data) 발행용 deploy key.
      # 시크릿이 없으면 발행은 비활성(MARKET_FLOW_PUBLISH 미설정)이라 발송만 수행.
      - name: Setup data-repo deploy key
        if: ${{ env.DATA_REPO_DEPLOY_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - name: Send Korea market flow
        env:
          GOLDENQUEENS_BOT_TOKEN: ${{ secrets.GOLDENQUEENS_BOT_TOKEN }}
          GOLDENQUEENS_CHAT_ID:   ${{ secrets.GOLDENQUEENS_CHAT_ID }}
          # 운영 발송 후 테스트 채널로도 동일 메시지 미러(확인용, best-effort)
          TEST_GOLDENQUEENS_BOT_TOKEN: ${{ secrets.TEST_GOLDENQUEENS_BOT_TOKEN }}
          TEST_GOLDENQUEENS_CHAT_ID:   ${{ secrets.TEST_GOLDENQUEENS_CHAT_ID }}
          MARKET_FLOW_MIRROR_TEST: '1'
          KIS_APP_KEY:            ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:         ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT:            ${{ secrets.KIS_ACCOUNT }}
          MARKET_FLOW_PUBLISH: ${{ env.DATA_REPO_DEPLOY_KEY != '' && '1' || '' }}
          MARKET_FLOW_REVALIDATE_URL: https://rs-golden-queens.vercel.app/api/revalidate
          MARKET_FLOW_REVALIDATE_SECRET: ${{ secrets.MARKET_FLOW_REVALIDATE_SECRET }}
          TZ: Asia/Seoul
        # pipefail(shell: bash) 로 main.py 의 종료 코드를 유지하며 실패 알림용 로그를 남긴다.
        shell: bash
        run: python main.py daily-kr ${{ inputs.date }} 2>&1 | tee "$RUNNER_TEMP/flow.log"

      # 위 단계 어디서든 실패·타임아웃하면 운영자(테스트) 채널로 알린다.
      # 구독자 채널에는 보내지 않는다. 원인은 tee 로그의 [FAIL] 줄에서 뽑는다.
      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        env:
          TEST_GOLDENQUEENS_BOT_TOKEN: ${{ secrets.TEST_GOLDENQUEENS_BOT_TOKEN }}
          TEST_GOLDENQUEENS_CHAT_ID:   ${{ secrets.TEST_GOLDENQUEENS_CHAT_ID }}
          TZ: Asia/Seoul
        run: python3 main.py --test notify-failure --log "$RUNNER_TEMP/flow.log"
