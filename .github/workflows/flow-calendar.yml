name: 거래일 캘린더 발행

on:
  # Cloudflare cron-worker(cron-worker/)가 주기적으로(예: 주 1회) dispatch.
  # 텔레그램 발송은 없고, 데이터 저장소의 calendar.json 만 갱신한다.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_REPO_DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Setup data-repo deploy key
        if: ${{ env.DATA_REPO_DEPLOY_KEY != '' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - name: Publish trading-day calendar
        env:
          MARKET_FLOW_PUBLISH: ${{ env.DATA_REPO_DEPLOY_KEY != '' && '1' || '' }}
          TZ: Asia/Seoul
        # pipefail(shell: bash) 로 main.py 의 종료 코드를 유지하며 실패 알림용 로그를 남긴다.
        shell: bash
        run: python main.py publish-calendar 2>&1 | tee "$RUNNER_TEMP/flow.log"

      # 위 단계 어디서든 실패·타임아웃하면 운영자(테스트) 채널로 알린다.
      # 구독자 채널에는 보내지 않는다. 원인은 tee 로그의 [FAIL] 줄에서 뽑는다.
      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        env:
          TEST_GOLDENQUEENS_BOT_TOKEN: ${{ secrets.TEST_GOLDENQUEENS_BOT_TOKEN }}
          TEST_GOLDENQUEENS_CHAT_ID:   ${{ secrets.TEST_GOLDENQUEENS_CHAT_ID }}
          TZ: Asia/Seoul
        run: python3 main.py --test notify-failure --log "$RUNNER_TEMP/flow.log"
